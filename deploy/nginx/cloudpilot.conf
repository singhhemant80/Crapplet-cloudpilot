# CloudPilot reverse proxy (nginx). Replace panel.example.com / api.example.com.
# Certificates: certbot --nginx -d panel.example.com -d api.example.com

limit_req_zone $binary_remote_addr zone=cp_api:10m rate=20r/s;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com api.example.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# Web panel (Next.js) — admin, reseller and customer portals
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Public API — reseller integrations (WHMCS etc.), payment webhooks, docs
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 512k;
    # Browser VNC console (websocket relay, single-use token in the query string).
    location /v1/console/ws {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 2h;
        proxy_send_timeout 2h;
        proxy_buffering off;
    }
    location / {
        limit_req zone=cp_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        # The API trusts X-Forwarded-For only from loopback (this proxy); set it to the real client.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    # Admin-only interactive docs; restrict to office/VPN ranges in production.
    location /docs {
        # allow 203.0.113.0/24;
        # deny all;
        proxy_pass http://127.0.0.1:4000;
    }
}
