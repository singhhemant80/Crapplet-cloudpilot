# IP-address mode (no domain yet): panel and API share one HTTP address.
# API paths go to the API (:4000); everything else to the panel (:3000).
# Replaced automatically when the installer is re-run with domains.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 1m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;

    location /v1/   { proxy_pass http://127.0.0.1:4000; proxy_read_timeout 60s; }
    location /docs  { proxy_pass http://127.0.0.1:4000; }
    location = /health { proxy_pass http://127.0.0.1:4000; }
    location = /ready  { proxy_pass http://127.0.0.1:4000; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # Headers set here replace the server-level ones, so repeat them.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
