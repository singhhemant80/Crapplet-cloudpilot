name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cloudpilot
          POSTGRES_PASSWORD: cloudpilot
          POSTGRES_DB: cloudpilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cloudpilot" --health-interval 5s --health-retries 20
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      TEST_DATABASE_URL: postgresql://cloudpilot:cloudpilot@127.0.0.1:5432/cloudpilot_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Hypervisor adapter contract tests
        run: npm run build -w @cloudpilot/hypervisor-sdk && npm test -w @cloudpilot/hypervisor-sdk
      - name: API typecheck
        run: npm run typecheck -w @cloudpilot/api
      - name: API integration tests (ledger, IPAM, orders, payments, HTTP)
        run: npm test -w @cloudpilot/api
      - name: Migrations are committed (schema.ts matches drizzle/)
        working-directory: apps/api
        run: |
          npx drizzle-kit generate --name ci_check
          if git status --porcelain drizzle | grep -q .; then echo "schema.ts changed without a migration"; git status drizzle; exit 1; fi
      - name: Web typecheck and build
        run: npm run typecheck -w @cloudpilot/web && npm run build -w @cloudpilot/web
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Lint WHMCS module (PHP)
        run: find integrations/whmcs -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Lint shell scripts
        run: |
          bash -n install.sh deploy/scripts/*.sh
          shellcheck --severity=error install.sh deploy/scripts/*.sh
